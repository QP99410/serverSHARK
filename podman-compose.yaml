services:
  mongodb:
    image: mongo:4.4
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  web:
    build: .
    container_name: servershark
    ports:
      - "8000:8000"
    environment:
      - DATABASE_HOST=mongodb
      - DJANGO_SETTINGS_MODULE=server.settings
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - mongodb
      - redis
    volumes:
      - .:/app                                          
  
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  mongodb_data: